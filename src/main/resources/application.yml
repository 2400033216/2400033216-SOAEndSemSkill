server:
  port: 8080

spring:
  application:
    name: tourist-record-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tourist_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

app:
  jwt:
    # Development key only. Override JWT_SECRET with a strong random secret in production.
    secret: ${JWT_SECRET:dev-only-secret-key-change-this-32-bytes-minimum}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  demo:
    # Demo credentials only; replace the token endpoint with your hotel authentication system.
    username: ${DEMO_USERNAME:hoteladmin}
    password: ${DEMO_PASSWORD:Hotel@123}
